name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=agents --cov=cache --cov=rag --cov=api \
            --cov=services --cov=middleware --cov=skillhub \
            --cov-report=term-missing --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            --tb=short

      - name: Check crawler/importer compiles
        working-directory: raw_data
        run: python -m compileall -q src

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/api-service/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: backend/api-service/test-results.xml

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/api-gateway/coverage.out

  lint-checks:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python lint (ruff check)
        uses: astral-sh/ruff-action@v3
        with:
          working-directory: backend/api-service
          args: check

      - name: Go vet
        run: cd backend/api-gateway && go vet ./...

      - name: Lint Dockerfile (Go gateway)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/api-gateway/dockerfile
          config: .hadolint.yaml

      - name: Lint Dockerfile (Python service)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/api-service/dockerfile
          config: .hadolint.yaml

      - name: Lint Dockerfile (Frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/dockerfile
          config: .hadolint.yaml

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  java-build:
    name: Java Pipeline Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/java-pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -q compile
