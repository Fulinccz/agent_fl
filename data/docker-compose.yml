version: '3.8'

services:
  redis:
    image: redis:8.4
    container_name: fulin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - fulin-network

  # Flink JobManager
  flink-jobmanager:
    image: flink:2.0.0-scala_2.12-java21
    container_name: fulin-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    command: jobmanager
    networks:
      - fulin-network

  # Flink TaskManager
  flink-taskmanager:
    image: flink:2.0.0-scala_2.12-java21
    container_name: fulin-flink-taskmanager
    restart: unless-stopped
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    networks:
      - fulin-network

volumes:
  redis_data:

networks:
  fulin-network:
    external: true
