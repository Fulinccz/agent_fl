name: fulinai

services:
  # MySQL - 数据存储
  mysql:
    image: mysql:8.0
    container_name: fulin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_crawler}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./raw_data/sql:/docker-entrypoint-initdb.d:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=512M
      --max-connections=200
      --slow-query-log=1
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - fulin-network

  # Redis - 缓存
  redis:
    image: redis:8.4
    container_name: fulin-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - fulin-network

  # Flink 为离线批处理 ETL，默认不启动；需要时：docker compose --profile data up
  flink-jobmanager:
    image: flink:2.0.0-scala_2.12-java21
    container_name: fulin-flink-jobmanager
    restart: unless-stopped
    profiles: ["data"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - JOB_MANAGER_HEAP_SIZE=512m
    command: jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - fulin-network

  flink-taskmanager:
    image: flink:2.0.0-scala_2.12-java21
    container_name: fulin-flink-taskmanager
    restart: unless-stopped
    profiles: ["data"]
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_HEAP_SIZE=1g
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
    command: taskmanager
    depends_on:
      - flink-jobmanager
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - fulin-network

  # Frontend（nginx-unprivileged 容器内监听 8080）
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "80:8080"
    depends_on:
      go-service:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - fulin-network

  # API Gateway (Go)
  go-service:
    build:
      context: ./backend/api-gateway
      dockerfile: dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      python-service:
        condition: service_healthy
    environment:
      - PYTHON_BASEURL=http://python-service:8000
      - GIN_MODE=release
      - GATEWAY_RATE_LIMIT=${GATEWAY_RATE_LIMIT:-50}
      - GATEWAY_RATE_BURST=${GATEWAY_RATE_BURST:-100}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - fulin-network

  # API Service (Python)
  python-service:
    build:
      context: ./backend/api-service
      dockerfile: dockerfile
    volumes:
      - ./ai/models:/app/ai/models:ro
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # Demo 默认关闭鉴权（前端无登录入口）；生产部署必须 AUTH_ENABLED=true 并配置 JWT_SECRET
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # 主链路（JDBC→Redis 批处理 + 在线服务）不依赖 Kafka，就绪探针默认不检查
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-fulin123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - fulin-network

  # Kafka 当前为预留组件（数据管道为 JDBC→Redis 批处理，不经过 Kafka）
  # 默认不启动；需要时：docker compose --profile kafka up
  # Zookeeper - Kafka 依赖
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fulin-zookeeper
    restart: unless-stopped
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - fulin-network

  # Kafka - 消息队列（预留，profile=kafka）
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fulin-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - fulin-network

  # Kafka UI - 可视化管理（profile=kafka）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fulin-kafka-ui
    restart: unless-stopped
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - fulin-network

  # Neo4j - 知识图谱（可选，仅 RAG 图谱检索需要）
  # 默认不启动；需要时：docker compose --profile graph up
  neo4j:
    image: neo4j:5-community
    container_name: fulin-neo4j
    restart: unless-stopped
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-fulin123456}
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - fulin-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  fulin-network:
    driver: bridge
    ipam:
      config:
        # 避开本机常见网段：langfuse_default 已占用 172.20.0.0/16
        - subnet: 172.28.0.0/16
