# 以非特权用户运行（nginx-unprivileged 镜像），监听 8080
server {
    listen 8080;
    server_name localhost;

    # 生产环境前置负载均衡/TLS 终止；如容器内直启 HTTPS 可参考文件末尾模板

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（后端业务限制 10MB，边缘留余量）
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite 构建产物带内容哈希，长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 禁止缓存，避免发版后新旧资源错配
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # 网关服务（docker-compose 中的 go-service）
        proxy_pass http://go-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式响应（SSE/JSON-lines）：禁用缓冲，放长读超时，否则事件被攒包批量迟达
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Accel-Buffering no;
    }
}

